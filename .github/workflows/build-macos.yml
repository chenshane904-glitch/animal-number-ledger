name: Build macOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter
        pip install pyinstaller

    - name: Build 香港.app
      run: |
        pyinstaller \
          --name="香港" \
          --windowed \
          --noconsole \
          --osx-bundle-identifier=com.animalledger.hongkong \
          --hidden-import=customtkinter \
          --hidden-import=PIL._tkinter_finder \
          --collect-all customtkinter \
          --onedir \
          app_hk.py

        echo "构建完成，检查输出..."
        ls -lh dist/

    - name: Verify .app file
      run: |
        echo "=== 检查 dist 目录 ==="
        ls -lh dist/

        echo ""
        echo "=== 查找所有 .app 文件 ==="
        find dist -name "*.app" -type d

        echo ""
        echo "=== 验证香港.app ==="
        if [ -d "dist/香港.app" ]; then
          echo "✅ 香港.app 生成成功"

          echo ""
          echo "=== 检查 Info.plist ==="
          if [ -f "dist/香港.app/Contents/Info.plist" ]; then
            /usr/libexec/PlistBuddy -c "Print CFBundleName" "dist/香港.app/Contents/Info.plist" || echo "无 CFBundleName"
            /usr/libexec/PlistBuddy -c "Print CFBundleDisplayName" "dist/香港.app/Contents/Info.plist" || echo "无 CFBundleDisplayName"
          fi
        else
          echo "❌ 香港.app 不存在"
          echo "实际生成的文件:"
          ls -la dist/
          exit 1
        fi

    - name: Install create-dmg
      run: |
        brew install create-dmg

    - name: Create DMG
      run: |
        create-dmg \
          --volname "香港" \
          --window-pos 200 120 \
          --window-size 600 400 \
          --icon-size 100 \
          --icon "香港.app" 175 120 \
          --hide-extension "香港.app" \
          --app-drop-link 425 120 \
          "香港.dmg" \
          "dist/香港.app" || true

        # 如果 create-dmg 失败，使用备用方案
        if [ ! -f "香港.dmg" ]; then
          echo "使用备用方案创建 DMG..."
          hdiutil create -volname "香港" -srcfolder "dist/香港.app" -ov -format UDZO "香港.dmg"
        fi

    - name: Verify DMG file
      run: |
        if [ -f "香港.dmg" ]; then
          echo "✅ 香港.dmg 生成成功"
          ls -lh 香港.dmg
        else
          echo "❌ 香港.dmg 生成失败"
          exit 1
        fi

    - name: Upload 香港.app
      uses: actions/upload-artifact@v4
      with:
        name: 香港-macOS-app
        path: dist/香港.app

    - name: Upload 香港.dmg
      uses: actions/upload-artifact@v4
      with:
        name: 香港-macOS-dmg
        path: 香港.dmg

    - name: Create Release (if tagged)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          香港.dmg
        name: 香港 ${{ github.ref_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
