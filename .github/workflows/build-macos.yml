name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-arm64:
    name: macOS ARM64
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pyinstaller==6.3.0 customtkinter==5.2.1 pillow==10.2.0

      - name: Build App
        run: |
          pyinstaller packaging/macos.spec --clean --noconfirm

      - name: Verify App Structure
        run: |
          echo "=== 检查 .app 结构 ==="

          # 检查主目录
          test -d "dist/AnimalNumberLedger.app/Contents" || (echo "✗ Contents/ 不存在" && exit 1)
          echo "✓ Contents/ 存在"

          test -d "dist/AnimalNumberLedger.app/Contents/MacOS" || (echo "✗ MacOS/ 不存在" && exit 1)
          echo "✓ MacOS/ 存在"

          test -d "dist/AnimalNumberLedger.app/Contents/Resources" || (echo "✗ Resources/ 不存在" && exit 1)
          echo "✓ Resources/ 存在"

          test -f "dist/AnimalNumberLedger.app/Contents/Info.plist" || (echo "✗ Info.plist 不存在" && exit 1)
          echo "✓ Info.plist 存在"

          # 检查可执行文件
          test -f "dist/AnimalNumberLedger.app/Contents/MacOS/AnimalNumberLedger" || (echo "✗ 可执行文件不存在" && exit 1)
          test -x "dist/AnimalNumberLedger.app/Contents/MacOS/AnimalNumberLedger" || (echo "✗ 可执行文件无执行权限" && exit 1)
          echo "✓ 可执行文件存在且有执行权限"

          # 检查资源文件
          echo ""
          echo "=== 检查资源文件 ==="

          if [ -d "dist/AnimalNumberLedger.app/Contents/Resources/assets" ]; then
            echo "✓ assets/ 在 Resources/"
            ls -la dist/AnimalNumberLedger.app/Contents/Resources/assets/
          elif [ -d "dist/AnimalNumberLedger.app/Contents/MacOS/assets" ]; then
            echo "✓ assets/ 在 MacOS/"
            ls -la dist/AnimalNumberLedger.app/Contents/MacOS/assets/
          else
            echo "✗ 找不到 assets/ 目录"
            exit 1
          fi

          echo ""
          echo "=== 结构检查通过 ==="

      - name: Sign App
        run: |
          echo "=== 签名应用 ==="
          codesign --force --deep --sign - dist/AnimalNumberLedger.app
          codesign --verify --verbose dist/AnimalNumberLedger.app
          echo "✓ 签名完成"

      - name: Test Launch App
        run: |
          echo "=== 启动测试 ==="

          # 尝试启动应用（后台运行）
          dist/AnimalNumberLedger.app/Contents/MacOS/AnimalNumberLedger &
          APP_PID=$!

          echo "应用进程 PID: $APP_PID"

          # 等待5秒
          sleep 5

          # 检查进程是否还在运行
          if ps -p $APP_PID > /dev/null; then
            echo "✓ 应用启动成功，进程正在运行"

            # 终止进程
            kill $APP_PID 2>/dev/null || true
            sleep 1
            kill -9 $APP_PID 2>/dev/null || true

            echo "✓ 启动测试通过"
          else
            echo "✗ 应用启动失败，进程已退出"
            echo ""
            echo "查看可能的错误日志..."
            ls -la ~/Library/Logs/ 2>/dev/null | grep -i animal || true
            exit 1
          fi

      - name: Create DMG
        run: |
          echo "=== 创建 DMG ==="
          mkdir -p dmg-temp
          cp -r dist/AnimalNumberLedger.app dmg-temp/
          ln -s /Applications dmg-temp/Applications
          hdiutil create -volname "AnimalNumberLedger" -srcfolder dmg-temp -ov -format UDZO AnimalNumberLedger-macOS-arm64.dmg
          ls -lh AnimalNumberLedger-macOS-arm64.dmg
          echo "✓ DMG 创建成功"

      - name: Upload DMG as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimalNumberLedger-macOS-arm64
          path: AnimalNumberLedger-macOS-arm64.dmg
          retention-days: 7
