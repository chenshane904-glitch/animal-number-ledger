name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-arm64:
    name: macOS ARM64
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pyinstaller==6.3.0 customtkinter==5.2.1 pillow==10.2.0

      - name: Build App
        run: |
          pyinstaller packaging/macos.spec --clean --noconfirm

      - name: Verify App Structure
        run: |
          echo "=== 验证 .app 结构 ==="
          ls -la dist/AnimalNumberLedger.app/Contents/
          echo ""
          echo "=== Info.plist 内容 ==="
          cat dist/AnimalNumberLedger.app/Contents/Info.plist
          echo ""
          echo "=== MacOS 目录 ==="
          ls -la dist/AnimalNumberLedger.app/Contents/MacOS/ | head -20
          echo ""
          echo "=== 检查可执行文件 ==="
          file dist/AnimalNumberLedger.app/Contents/MacOS/AnimalNumberLedger
          otool -L dist/AnimalNumberLedger.app/Contents/MacOS/AnimalNumberLedger | head -20

      - name: Test Launch App
        run: |
          echo "=== 尝试启动应用 ==="
          timeout 10s dist/AnimalNumberLedger.app/Contents/MacOS/AnimalNumberLedger --version || true
          echo "启动测试完成"

      - name: Sign and Create DMG
        run: |
          codesign --force --deep --sign - dist/AnimalNumberLedger.app
          codesign --verify --verbose=4 dist/AnimalNumberLedger.app 2>&1 || true
          mkdir -p dmg-temp
          cp -r dist/AnimalNumberLedger.app dmg-temp/
          ln -s /Applications dmg-temp/Applications
          hdiutil create -volname "AnimalNumberLedger" -srcfolder dmg-temp -ov -format UDZO AnimalNumberLedger-macOS-arm64.dmg
          ls -lh AnimalNumberLedger-macOS-arm64.dmg

      - name: Upload DMG as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimalNumberLedger-macOS-arm64
          path: AnimalNumberLedger-macOS-arm64.dmg
          retention-days: 7
