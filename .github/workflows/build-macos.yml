name: Build macOS App (ARM64)

on:
  workflow_dispatch:  # 手动触发
  push:
    tags:
      - 'v*'  # 版本标签触发

jobs:
  build-macos-arm64:
    name: Build for Apple Silicon (arm64)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show environment info
        run: |
          echo "=== Environment Info ==="
          sw_vers
          uname -m
          python3 --version
          echo "=== PyInstaller 版本 ==="
          pip3 show pyinstaller || echo "PyInstaller 未安装"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'arm64'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements-macos.txt

      - name: Verify assets directory
        run: |
          echo "=== 验证 assets 目录 ==="
          if [ -d "assets" ]; then
            echo "✓ assets 目录存在"
            ls -la assets/
          else
            echo "✗ assets 目录不存在"
            exit 1
          fi

      - name: Verify spec file
        run: |
          echo "=== 验证 spec 文件 ==="
          if [ -f "packaging/macos.spec" ]; then
            echo "✓ macos.spec 存在"
            head -20 packaging/macos.spec
          else
            echo "✗ macos.spec 不存在"
            exit 1
          fi

      - name: Build app with PyInstaller
        run: |
          echo "=== 开始构建 ==="
          pyinstaller packaging/macos.spec --clean --noconfirm

      - name: Verify app bundle structure
        run: |
          echo "=== 验证 .app 结构 ==="

          # 检查 .app 是否存在
          if [ ! -d "dist/AnimalNumberLedger.app" ]; then
            echo "✗ .app 不存在"
            exit 1
          fi
          echo "✓ .app 存在"

          # 检查 Contents 目录
          if [ ! -d "dist/AnimalNumberLedger.app/Contents" ]; then
            echo "✗ Contents 目录不存在"
            exit 1
          fi
          echo "✓ Contents 目录存在"

          # 检查 Info.plist
          if [ ! -f "dist/AnimalNumberLedger.app/Contents/Info.plist" ]; then
            echo "✗ Info.plist 不存在"
            exit 1
          fi
          echo "✓ Info.plist 存在"

          # 检查可执行文件
          if [ ! -f "dist/AnimalNumberLedger.app/Contents/MacOS/AnimalNumberLedger" ]; then
            echo "✗ 可执行文件不存在"
            exit 1
          fi
          echo "✓ 可执行文件存在"

          # 检查可执行文件权限
          if [ ! -x "dist/AnimalNumberLedger.app/Contents/MacOS/AnimalNumberLedger" ]; then
            echo "✗ 可执行文件没有执行权限"
            exit 1
          fi
          echo "✓ 可执行文件有执行权限"

          # 显示目录结构
          echo ""
          echo "=== .app 目录结构 ==="
          ls -laR dist/AnimalNumberLedger.app/Contents/ | head -100

      - name: Verify executable architecture
        run: |
          echo "=== 验证可执行文件架构 ==="
          file dist/AnimalNumberLedger.app/Contents/MacOS/AnimalNumberLedger
          lipo -info dist/AnimalNumberLedger.app/Contents/MacOS/AnimalNumberLedger || true

      - name: Verify assets in bundle
        run: |
          echo "=== 验证资源文件是否打包 ==="
          if [ -d "dist/AnimalNumberLedger.app/Contents/MacOS/assets" ]; then
            echo "✓ assets 目录已打包"
            ls -la dist/AnimalNumberLedger.app/Contents/MacOS/assets/
          else
            echo "✗ assets 目录未打包"
            exit 1
          fi

      - name: Sign app (ad-hoc)
        run: |
          echo "=== 签名应用 ==="
          codesign --force --deep --sign - dist/AnimalNumberLedger.app
          codesign --verify --verbose dist/AnimalNumberLedger.app

      - name: Create DMG
        run: |
          echo "=== 创建 DMG ==="
          mkdir -p dmg
          cp -r dist/AnimalNumberLedger.app dmg/
          ln -s /Applications dmg/Applications

          hdiutil create -volname "AnimalNumberLedger" \
            -srcfolder dmg \
            -ov -format UDZO \
            AnimalNumberLedger-arm64.dmg

          ls -lh AnimalNumberLedger-arm64.dmg

      - name: Verify DMG
        run: |
          echo "=== 验证 DMG ==="
          if [ ! -f "AnimalNumberLedger-arm64.dmg" ]; then
            echo "✗ DMG 文件不存在"
            exit 1
          fi
          echo "✓ DMG 文件存在"

          # 获取DMG大小
          DMG_SIZE=$(ls -lh AnimalNumberLedger-arm64.dmg | awk '{print $5}')
          echo "DMG 大小: $DMG_SIZE"

          # 挂载DMG验证
          echo "挂载 DMG 进行验证..."
          hdiutil attach AnimalNumberLedger-arm64.dmg -mountpoint /tmp/test_dmg

          # 检查.app是否在DMG中
          if [ -d "/tmp/test_dmg/AnimalNumberLedger.app" ]; then
            echo "✓ DMG 中包含 .app"
          else
            echo "✗ DMG 中不包含 .app"
            hdiutil detach /tmp/test_dmg
            exit 1
          fi

          # 卸载DMG
          hdiutil detach /tmp/test_dmg
          echo "✓ DMG 验证通过"

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: AnimalNumberLedger-arm64.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 十二动物号码归纳器 macOS 版本

            ### 安装说明
            1. 下载 `AnimalNumberLedger-arm64.dmg`
            2. 双击打开 DMG
            3. 将应用拖动到 Applications 文件夹
            4. 首次启动：右键点击应用 → 打开（绕过 Gatekeeper）

            ### 系统要求
            - macOS 10.13 或更高版本
            - Apple Silicon (M1/M2/M3)

            ### 本次更新
            - 新增头数筛选功能
            - 优化资源文件打包
            - 修复已知问题
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "=== 构建完成 ==="
          echo "✓ .app 已创建"
          echo "✓ DMG 已创建"
          echo "✓ 所有验证通过"
          echo ""
          echo "下一步："
          echo "1. 下载 DMG 文件"
          echo "2. 在 macOS 上安装测试"
          echo "3. 验证应用启动"
          echo "4. 验证功能正常"
