name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-arm64:
    name: macOS ARM64 (Apple Silicon)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'arm64'

      - name: Environment Info
        run: |
          echo "=== 环境信息 ==="
          sw_vers
          uname -m
          python3 --version
          which python3

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements-macos.txt
          pip list

      - name: Verify Project Structure
        run: |
          echo "=== 验证项目结构 ==="

          echo "检查主入口..."
          test -f "app.py" && echo "✓ app.py" || (echo "✗ app.py 缺失" && exit 1)

          echo "检查assets目录..."
          test -d "assets" && echo "✓ assets/" || (echo "✗ assets/ 缺失" && exit 1)
          ls -la assets/

          echo "检查spec文件..."
          test -f "packaging/macos.spec" && echo "✓ macos.spec" || (echo "✗ macos.spec 缺失" && exit 1)

          echo "检查核心模块..."
          test -f "database.py" && echo "✓ database.py" || echo "✗ database.py"
          test -f "parser.py" && echo "✓ parser.py" || echo "✗ parser.py"
          test -f "calculator.py" && echo "✓ calculator.py" || echo "✗ calculator.py"
          test -d "ui" && echo "✓ ui/" || echo "✗ ui/"

      - name: Build with PyInstaller
        run: |
          echo "=== 开始构建 ==="
          pyinstaller packaging/macos.spec --clean --noconfirm

      - name: Verify .app Bundle
        run: |
          echo "=== 验证 .app 结构 ==="

          APP_PATH="dist/AnimalNumberLedger.app"

          # 检查 .app
          if [ ! -d "$APP_PATH" ]; then
            echo "✗ .app 不存在"
            exit 1
          fi
          echo "✓ .app 存在"

          # 检查 Contents
          if [ ! -d "$APP_PATH/Contents" ]; then
            echo "✗ Contents/ 不存在"
            exit 1
          fi
          echo "✓ Contents/ 存在"

          # 检查 MacOS
          if [ ! -d "$APP_PATH/Contents/MacOS" ]; then
            echo "✗ Contents/MacOS/ 不存在"
            exit 1
          fi
          echo "✓ Contents/MacOS/ 存在"

          # 检查可执行文件
          EXEC_PATH="$APP_PATH/Contents/MacOS/AnimalNumberLedger"
          if [ ! -f "$EXEC_PATH" ]; then
            echo "✗ 可执行文件不存在"
            exit 1
          fi
          echo "✓ 可执行文件存在"

          # 检查可执行权限
          if [ ! -x "$EXEC_PATH" ]; then
            echo "✗ 可执行文件无执行权限"
            exit 1
          fi
          echo "✓ 可执行文件有执行权限"

          # 检查 Info.plist
          if [ ! -f "$APP_PATH/Contents/Info.plist" ]; then
            echo "✗ Info.plist 不存在"
            exit 1
          fi
          echo "✓ Info.plist 存在"

          # 检查 Resources（如果有资源文件的话）
          if [ -d "$APP_PATH/Contents/Resources" ]; then
            echo "✓ Contents/Resources/ 存在"
            ls -la "$APP_PATH/Contents/Resources/" | head -20
          fi

          # 显示目录结构
          echo ""
          echo "=== .app 目录结构 ==="
          find "$APP_PATH/Contents" -maxdepth 3 -type f | head -30

      - name: Verify Resources
        run: |
          echo "=== 验证资源文件 ==="

          # 查找assets目录
          if [ -d "dist/AnimalNumberLedger.app/Contents/MacOS/assets" ]; then
            echo "✓ assets/ 在 MacOS/"
            ls -la dist/AnimalNumberLedger.app/Contents/MacOS/assets/
          elif [ -d "dist/AnimalNumberLedger.app/Contents/Resources/assets" ]; then
            echo "✓ assets/ 在 Resources/"
            ls -la dist/AnimalNumberLedger.app/Contents/Resources/assets/
          else
            echo "⚠ 未找到 assets/ 目录"
          fi

      - name: Check Architecture
        run: |
          echo "=== 检查架构 ==="
          file dist/AnimalNumberLedger.app/Contents/MacOS/AnimalNumberLedger
          lipo -info dist/AnimalNumberLedger.app/Contents/MacOS/AnimalNumberLedger || true

      - name: Code Sign
        run: |
          echo "=== 代码签名 ==="
          codesign --force --deep --sign - dist/AnimalNumberLedger.app
          codesign --verify --verbose dist/AnimalNumberLedger.app

      - name: Create DMG
        run: |
          echo "=== 创建 DMG ==="

          # 创建临时目录
          mkdir -p dmg-temp

          # 复制 .app
          cp -r dist/AnimalNumberLedger.app dmg-temp/

          # 创建 Applications 快捷方式
          ln -s /Applications dmg-temp/Applications

          # 生成 DMG
          hdiutil create -volname "AnimalNumberLedger" \
            -srcfolder dmg-temp \
            -ov -format UDZO \
            AnimalNumberLedger-macOS-arm64.dmg

          # 显示文件信息
          ls -lh AnimalNumberLedger-macOS-arm64.dmg
          du -h AnimalNumberLedger-macOS-arm64.dmg

      - name: Verify DMG
        run: |
          echo "=== 验证 DMG ==="

          # 检查文件存在
          if [ ! -f "AnimalNumberLedger-macOS-arm64.dmg" ]; then
            echo "✗ DMG 文件不存在"
            exit 1
          fi
          echo "✓ DMG 文件存在"

          # 挂载测试
          echo "挂载 DMG..."
          hdiutil attach AnimalNumberLedger-macOS-arm64.dmg -mountpoint /tmp/test-dmg

          # 检查内容
          echo "DMG 内容:"
          ls -la /tmp/test-dmg/

          if [ -d "/tmp/test-dmg/AnimalNumberLedger.app" ]; then
            echo "✓ DMG 包含 .app"
          else
            echo "✗ DMG 不包含 .app"
            hdiutil detach /tmp/test-dmg
            exit 1
          fi

          # 卸载
          hdiutil detach /tmp/test-dmg
          echo "✓ DMG 验证通过"

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: AnimalNumberLedger-macOS-arm64.dmg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-intel:
    name: macOS x86_64 (Intel)
    runs-on: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Environment Info
        run: |
          echo "=== 环境信息 ==="
          sw_vers
          uname -m
          python3 --version

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements-macos.txt

      - name: Verify Project Structure
        run: |
          echo "=== 验证项目结构 ==="
          test -f "app.py" && echo "✓ app.py" || exit 1
          test -d "assets" && echo "✓ assets/" || exit 1
          test -f "packaging/macos.spec" && echo "✓ macos.spec" || exit 1

      - name: Build with PyInstaller
        run: |
          echo "=== 开始构建 ==="
          pyinstaller packaging/macos.spec --clean --noconfirm

      - name: Verify .app Bundle
        run: |
          echo "=== 验证 .app 结构 ==="
          test -d "dist/AnimalNumberLedger.app" && echo "✓ .app" || exit 1
          test -f "dist/AnimalNumberLedger.app/Contents/MacOS/AnimalNumberLedger" && echo "✓ 可执行文件" || exit 1
          test -x "dist/AnimalNumberLedger.app/Contents/MacOS/AnimalNumberLedger" && echo "✓ 执行权限" || exit 1
          test -f "dist/AnimalNumberLedger.app/Contents/Info.plist" && echo "✓ Info.plist" || exit 1

      - name: Check Architecture
        run: |
          echo "=== 检查架构 ==="
          file dist/AnimalNumberLedger.app/Contents/MacOS/AnimalNumberLedger
          lipo -info dist/AnimalNumberLedger.app/Contents/MacOS/AnimalNumberLedger || true

      - name: Code Sign
        run: |
          echo "=== 代码签名 ==="
          codesign --force --deep --sign - dist/AnimalNumberLedger.app
          codesign --verify --verbose dist/AnimalNumberLedger.app

      - name: Create DMG
        run: |
          echo "=== 创建 DMG ==="
          mkdir -p dmg-temp
          cp -r dist/AnimalNumberLedger.app dmg-temp/
          ln -s /Applications dmg-temp/Applications

          hdiutil create -volname "AnimalNumberLedger" \
            -srcfolder dmg-temp \
            -ov -format UDZO \
            AnimalNumberLedger-macOS-x86_64.dmg

          ls -lh AnimalNumberLedger-macOS-x86_64.dmg

      - name: Verify DMG
        run: |
          echo "=== 验证 DMG ==="
          test -f "AnimalNumberLedger-macOS-x86_64.dmg" && echo "✓ DMG" || exit 1

          hdiutil attach AnimalNumberLedger-macOS-x86_64.dmg -mountpoint /tmp/test-dmg
          test -d "/tmp/test-dmg/AnimalNumberLedger.app" && echo "✓ DMG内容" || exit 1
          hdiutil detach /tmp/test-dmg

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: AnimalNumberLedger-macOS-x86_64.dmg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
