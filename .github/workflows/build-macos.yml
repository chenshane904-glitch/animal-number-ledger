name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-arm64:
    name: macOS ARM64
    runs-on: macos-14  # 明确使用 macOS 14 (Apple Silicon)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements-macos.txt

      - name: Build App
        run: |
          pyinstaller packaging/macos.spec --clean --noconfirm

      - name: Verify App
        run: |
          test -d "dist/AnimalNumberLedger.app"
          test -f "dist/AnimalNumberLedger.app/Contents/MacOS/AnimalNumberLedger"
          test -x "dist/AnimalNumberLedger.app/Contents/MacOS/AnimalNumberLedger"

      - name: Sign App
        run: |
          codesign --force --deep --sign - dist/AnimalNumberLedger.app

      - name: Create DMG
        run: |
          mkdir -p dmg-temp
          cp -r dist/AnimalNumberLedger.app dmg-temp/
          ln -s /Applications dmg-temp/Applications
          hdiutil create -volname "AnimalNumberLedger" -srcfolder dmg-temp -ov -format UDZO AnimalNumberLedger-macOS-arm64.dmg

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: AnimalNumberLedger-macOS-arm64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
